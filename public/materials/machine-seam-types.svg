<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 540" role="img" aria-labelledby="t d"><title id="t">Основные машинные швы</title><desc id="d">Схематические поперечные виды стачного, накладного, вподгибку и запошивочного швов.</desc><rect width="1080" height="540" rx="28" fill="#f8fafc"/><text x="40" y="55" font-family="Arial" font-size="28" font-weight="700" fill="#0f172a">Основные машинные швы</text><g font-family="Arial" text-anchor="middle" fill="#0f172a"><g transform="translate(50 120)"><rect width="220" height="260" rx="16" fill="white" stroke="#cbd5e1" stroke-width="3"/><path d="M35 130h75V65M185 130h-75V65" stroke="#2563eb" stroke-width="12" fill="none"/><path d="M110 65v120" stroke="#ef4444" stroke-width="4" stroke-dasharray="7 6"/><text x="110" y="225" font-size="21" font-weight="700">Стачной</text></g><g transform="translate(305 120)"><rect width="220" height="260" rx="16" fill="white" stroke="#cbd5e1" stroke-width="3"/><path d="M35 120h150M70 85h115" stroke="#2563eb" stroke-width="12"/><path d="M85 70v85" stroke="#ef4444" stroke-width="4" stroke-dasharray="7 6"/><text x="110" y="225" font-size="21" font-weight="700">Накладной</text></g><g transform="translate(560 120)"><rect width="220" height="260" rx="16" fill="white" stroke="#cbd5e1" stroke-width="3"/><path d="M35 90h115v55H95v-25h90" stroke="#2563eb" stroke-width="12" fill="none"/><path d="M105 110v70" stroke="#ef4444" stroke-width="4" stroke-dasharray="7 6"/><text x="110" y="225" font-size="21" font-weight="700">Вподгибку</text></g><g transform="translate(815 120)"><rect width="220" height="260" rx="16" fill="white" stroke="#cbd5e1" stroke-width="3"/><path d="M30 100h90v55h70M190 75h-90v55H30" stroke="#2563eb" stroke-width="12" fill="none"/><path d="M92 70v105M128 70v105" stroke="#ef4444" stroke-width="4" stroke-dasharray="7 6"/><text x="110" y="225" font-size="21" font-weight="700">Запошивочный</text></g></g><text x="50" y="455" font-family="Arial" font-size="18" fill="#64748b">Синим показаны слои материала, красной пунктирной линией — машинная строчка.</text></svg>

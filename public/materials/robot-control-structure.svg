<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t"><title id="t">Структура системы управления роботом</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#246bd3"/></marker></defs><style>.h{font:700 29px Arial;fill:#17325c}.n{font:700 21px Arial;fill:#174ea6}.p{font:16px Arial;fill:#40536c}.b{fill:#f8fbff;stroke:#8db3ed;stroke-width:3}.a{stroke:#246bd3;stroke-width:5;marker-end:url(#a)}</style><rect width="1200" height="500" fill="white"/><text x="600" y="48" text-anchor="middle" class="h">Структура робототехнической системы</text><g transform="translate(30 145)"><rect width="210" height="190" rx="16" class="b"/><text x="105" y="45" text-anchor="middle" class="n">Датчики</text><text x="105" y="85" text-anchor="middle" class="p">свет, расстояние</text><text x="105" y="115" text-anchor="middle" class="p">температура</text><text x="105" y="145" text-anchor="middle" class="p">положение</text></g><path d="M245 240h70" class="a"/><g transform="translate(320 145)"><rect width="210" height="190" rx="16" class="b"/><text x="105" y="45" text-anchor="middle" class="n">Контроллер</text><text x="105" y="90" text-anchor="middle" class="p">программа</text><text x="105" y="120" text-anchor="middle" class="p">входы / выходы</text></g><path d="M535 240h70" class="a"/><g transform="translate(610 145)"><rect width="210" height="190" rx="16" class="b"/><text x="105" y="45" text-anchor="middle" class="n">Драйвер</text><text x="105" y="90" text-anchor="middle" class="p">усиление сигнала</text><text x="105" y="120" text-anchor="middle" class="p">защита выхода</text></g><path d="M825 240h70" class="a"/><g transform="translate(900 145)"><rect width="270" height="190" rx="16" class="b"/><text x="135" y="45" text-anchor="middle" class="n">Исполнитель</text><text x="135" y="85" text-anchor="middle" class="p">двигатель, сервопривод</text><text x="135" y="115" text-anchor="middle" class="p">реле, нагреватель</text></g><path d="M1035 340v90H135v-90" fill="none" stroke="#e08a28" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#a)"/><text x="600" y="465" text-anchor="middle" class="n">Обратная связь</text></svg>

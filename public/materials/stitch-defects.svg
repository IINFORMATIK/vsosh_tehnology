<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t"><title id="t">Дефекты машинной строчки</title><style>.h{font:700 29px Arial;fill:#17325c}.n{font:700 19px Arial;fill:#174ea6}.p{font:15px Arial;fill:#40536c}.cloth{fill:#f4ead9;stroke:#be9d6c;stroke-width:2}.top{fill:none;stroke:#246bd3;stroke-width:5}.bottom{fill:none;stroke:#e08a28;stroke-width:5}.bad{fill:none;stroke:#d14242;stroke-width:5}</style><rect width="1200" height="600" fill="white"/><text x="600" y="48" text-anchor="middle" class="h">Машинная строчка: норма и дефекты</text><g transform="translate(35 100)"><text x="135" y="25" text-anchor="middle" class="n">Правильная</text><rect x="15" y="65" width="240" height="160" rx="8" class="cloth"/><path d="M30 115h210" class="top"/><path d="M30 175h210" class="bottom"/><path d="M50 115q20 60 40 0m0 0q20 60 40 0m0 0q20 60 40 0m0 0q20 60 40 0" class="top"/><text x="135" y="265" text-anchor="middle" class="p">переплетение внутри</text></g><g transform="translate(330 100)"><text x="135" y="25" text-anchor="middle" class="n">Петли снизу</text><rect x="15" y="65" width="240" height="160" rx="8" class="cloth"/><path d="M30 110h210" class="top"/><path d="M30 175q20 60 40 0t40 0t40 0t40 0t40 0" class="bad"/><text x="135" y="265" text-anchor="middle" class="p">проверить верхнюю заправку</text></g><g transform="translate(625 100)"><text x="135" y="25" text-anchor="middle" class="n">Стягивание</text><path d="M15 90q30-25 60 0t60 0t60 0t60 0v135H15z" class="cloth"/><path d="M25 140q30-20 60 0t60 0t60 0" class="bad"/><text x="135" y="265" text-anchor="middle" class="p">натяжение или короткий стежок</text></g><g transform="translate(920 100)"><text x="120" y="25" text-anchor="middle" class="n">Пропуски</text><rect x="0" y="65" width="240" height="160" rx="8" class="cloth"/><path d="M15 135h55m45 0h45m45 0h20" class="bad"/><text x="120" y="265" text-anchor="middle" class="p">проверить иглу</text></g><g transform="translate(250 450)"><path d="M0 0h70" class="top"/><text x="85" y="6" class="p">верхняя нить</text><path d="M350 0h70" class="bottom"/><text x="435" y="6" class="p">нижняя нить</text><path d="M690 0h70" class="bad"/><text x="775" y="6" class="p">дефект</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t"><title id="t">Базирование заготовки</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#246bd3"/></marker></defs><style>.h{font:700 29px Arial;fill:#17325c}.n{font:700 20px Arial;fill:#174ea6}.p{font:16px Arial;fill:#40536c}.part{fill:#dce8f8;stroke:#315a8c;stroke-width:4}.base{fill:#eef1f5;stroke:#65758b;stroke-width:4}.point{fill:#e08a28;stroke:#a85c0c;stroke-width:2}.a{stroke:#246bd3;stroke-width:5;marker-end:url(#a)}</style><rect width="1200" height="600" fill="white"/><text x="600" y="48" text-anchor="middle" class="h">Схема базирования заготовки</text><polygon points="300,185 800,185 940,285 440,285" class="part"/><polygon points="440,285 940,285 940,430 440,430" class="part"/><polygon points="300,185 440,285 440,430 300,330" class="part"/><rect x="230" y="445" width="800" height="65" rx="8" class="base"/><g class="point"><circle cx="430" cy="430" r="13"/><circle cx="650" cy="430" r="13"/><circle cx="870" cy="430" r="13"/><circle cx="925" cy="335" r="13"/><circle cx="925" cy="390" r="13"/><circle cx="365" cy="385" r="13"/></g><path d="M650 120v60M1010 335h-75M250 385h105" class="a"/><text x="680" y="115" class="n">Зажим к опорам</text><text x="80" y="560" class="p">3 опоры ограничивают перемещение по вертикали и два поворота</text><text x="480" y="560" class="p">2 боковые опоры ограничивают боковое перемещение и поворот</text><text x="905" y="560" class="p">1 упор ограничивает продольное перемещение</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" role="img" aria-labelledby="title desc">
  <title id="title">Модель сбалансированного приёма пищи</title><desc id="desc">Условное распределение овощей, белковых продуктов и сложных углеводов на тарелке.</desc>
  <rect width="940" height="560" rx="28" fill="#f8fafc"/><text x="42" y="55" font-family="Arial" font-size="28" font-weight="700" fill="#0f172a">Модель сбалансированного приёма пищи</text>
  <g transform="translate(90 100)"><circle cx="210" cy="210" r="185" fill="#fff" stroke="#cbd5e1" stroke-width="8"/><path d="M210 210V25A185 185 0 0 0 210 395Z" fill="#4ade80"/><path d="M210 210V25A185 185 0 0 1 395 210Z" fill="#fbbf24"/><path d="M210 210H395A185 185 0 0 1 210 395Z" fill="#60a5fa"/><circle cx="210" cy="210" r="185" fill="none" stroke="#fff" stroke-width="5"/></g>
  <g font-family="Arial" fill="#0f172a"><text x="525" y="160" font-size="23" font-weight="700">½ Овощи и зелень</text><text x="525" y="194" font-size="18" fill="#64748b">Разнообразие цветов и способов обработки</text><text x="525" y="270" font-size="23" font-weight="700">¼ Белковые продукты</text><text x="525" y="304" font-size="18" fill="#64748b">Мясо, рыба, яйца, бобовые, молочные продукты</text><text x="525" y="380" font-size="23" font-weight="700">¼ Сложные углеводы</text><text x="525" y="414" font-size="18" fill="#64748b">Крупы, цельнозерновые продукты, картофель</text><text x="525" y="485" font-size="17" fill="#475569">Состав рациона зависит от возраста, активности и состояния здоровья.</text></g>
</svg>

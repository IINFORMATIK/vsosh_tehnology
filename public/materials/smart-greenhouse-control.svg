<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Контур управления умной теплицей</title><desc id="desc">Датчики, контроллер, исполнительные устройства и обратная связь</desc>
  <defs><style>.t{font:700 30px Arial;fill:#17325c}.h{font:700 22px Arial;fill:#174ea6}.p{font:18px Arial;fill:#30445f}.b{fill:#f7faff;stroke:#79a7ef;stroke-width:3}.g{fill:#f2fbf5;stroke:#56a875;stroke-width:3}.a{fill:none;stroke:#246bd3;stroke-width:5;marker-end:url(#m)}.fb{fill:none;stroke:#e08a28;stroke-width:5;stroke-dasharray:12 8;marker-end:url(#o)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#246bd3"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#e08a28"/></marker></defs>
  <rect width="1200" height="620" fill="#fff"/><text x="600" y="48" text-anchor="middle" class="t">Замкнутый контур управления теплицей</text>
  <rect x="45" y="170" width="220" height="220" rx="22" class="b"/><text x="155" y="210" text-anchor="middle" class="h">Датчики</text><text x="70" y="252" class="p">• температура</text><text x="70" y="284" class="p">• влажность</text><text x="70" y="316" class="p">• освещённость</text><text x="70" y="348" class="p">• pH, EC, уровень</text>
  <rect x="355" y="170" width="220" height="220" rx="22" class="b"/><text x="465" y="210" text-anchor="middle" class="h">Контроллер</text><text x="380" y="258" class="p">Уставки</text><text x="380" y="292" class="p">Гистерезис</text><text x="380" y="326" class="p">Задержки</text><text x="380" y="360" class="p">Аварийный режим</text>
  <rect x="665" y="170" width="220" height="220" rx="22" class="b"/><text x="775" y="210" text-anchor="middle" class="h">Исполнители</text><text x="690" y="252" class="p">• насос и клапан</text><text x="690" y="284" class="p">• вентилятор</text><text x="690" y="316" class="p">• нагреватель</text><text x="690" y="348" class="p">• фитосвет</text>
  <rect x="975" y="170" width="180" height="220" rx="22" class="g"/><text x="1065" y="210" text-anchor="middle" class="h">Объект</text><text x="1065" y="255" text-anchor="middle" class="p">Среда</text><text x="1065" y="288" text-anchor="middle" class="p">и растения</text><path d="M1020 345q45-75 90 0" fill="none" stroke="#42a166" stroke-width="8"/>
  <path d="M265 280H350M575 280H660M885 280H970" class="a"/><path d="M1065 400V510H155V395" class="fb"/><text x="610" y="548" text-anchor="middle" class="h" fill="#b96512">Обратная связь: измерить результат и скорректировать управление</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Электронные компоненты</title><desc id="d">Условные обозначения и назначение основных электронных компонентов</desc><style>.h{font:700 28px Arial;fill:#17325c}.n{font:700 20px Arial;fill:#174ea6}.p{font:16px Arial;fill:#40536c}.b{fill:#f8fbff;stroke:#a9c3eb;stroke-width:2}.s{fill:none;stroke:#203b60;stroke-width:5}</style><rect width="1200" height="520" fill="white"/><text x="600" y="45" text-anchor="middle" class="h">Основные электронные компоненты</text><g transform="translate(30 85)"><rect width="210" height="380" rx="16" class="b"/><text x="105" y="38" text-anchor="middle" class="n">Резистор</text><path d="M35 130h35l12-20 20 40 20-40 20 40 20-40 12 20h35" class="s"/><text x="105" y="205" text-anchor="middle" class="p">Ограничивает ток</text><text x="105" y="233" text-anchor="middle" class="p">R, Ом</text></g><g transform="translate(262 85)"><rect width="210" height="380" rx="16" class="b"/><text x="105" y="38" text-anchor="middle" class="n">Диод</text><path d="M35 130h55m30 0h55M90 95v70l60-35zM150 95v70" class="s"/><text x="105" y="205" text-anchor="middle" class="p">Проводит в одном</text><text x="105" y="233" text-anchor="middle" class="p">направлении</text></g><g transform="translate(494 85)"><rect width="210" height="380" rx="16" class="b"/><text x="105" y="38" text-anchor="middle" class="n">Светодиод</text><path d="M35 130h55m30 0h55M90 95v70l60-35zM150 95v70M145 85l32-25m-15 45l32-25" class="s"/><text x="105" y="205" text-anchor="middle" class="p">Излучает свет</text><text x="105" y="233" text-anchor="middle" class="p">требует резистор</text></g><g transform="translate(726 85)"><rect width="210" height="380" rx="16" class="b"/><text x="105" y="38" text-anchor="middle" class="n">Транзистор</text><circle cx="110" cy="130" r="55" class="s"/><path d="M35 130h55m0-40v80m0-20l65 55m-65-95l65-55" class="s"/><text x="105" y="225" text-anchor="middle" class="p">Электронный ключ</text><text x="105" y="253" text-anchor="middle" class="p">и усилитель</text></g><g transform="translate(958 85)"><rect width="210" height="380" rx="16" class="b"/><text x="105" y="38" text-anchor="middle" class="n">Реле</text><rect x="38" y="95" width="70" height="70" class="s"/><path d="M130 165l45-65m-45 65h55" class="s"/><text x="105" y="225" text-anchor="middle" class="p">Коммутирует</text><text x="105" y="253" text-anchor="middle" class="p">силовую цепь</text></g></svg>

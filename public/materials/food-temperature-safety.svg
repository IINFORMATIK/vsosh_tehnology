<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" role="img" aria-labelledby="title desc">
  <title id="title">Температурные зоны хранения и обработки продуктов</title><desc id="desc">Холодильное хранение, опасная температурная зона и горячее поддержание.</desc>
  <rect width="980" height="500" rx="28" fill="#f8fafc"/><text x="42" y="55" font-family="Arial" font-size="28" font-weight="700" fill="#0f172a">Температура и пищевая безопасность</text>
  <g transform="translate(70 135)"><rect width="250" height="170" rx="18" fill="#dbeafe" stroke="#60a5fa" stroke-width="4"/><text x="125" y="58" text-anchor="middle" font-family="Arial" font-size="42">❄</text><text x="125" y="105" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#1e3a8a">Холод</text><text x="125" y="138" text-anchor="middle" font-family="Arial" font-size="18" fill="#1e40af">Замедляет рост</text><text x="125" y="160" text-anchor="middle" font-family="Arial" font-size="18" fill="#1e40af">микроорганизмов</text></g>
  <g transform="translate(365 135)"><rect width="250" height="170" rx="18" fill="#fef3c7" stroke="#f59e0b" stroke-width="4"/><text x="125" y="58" text-anchor="middle" font-family="Arial" font-size="42">!</text><text x="125" y="105" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#78350f">Опасная зона</text><text x="125" y="138" text-anchor="middle" font-family="Arial" font-size="18" fill="#92400e">Не оставлять готовую</text><text x="125" y="160" text-anchor="middle" font-family="Arial" font-size="18" fill="#92400e">пищу надолго</text></g>
  <g transform="translate(660 135)"><rect width="250" height="170" rx="18" fill="#fee2e2" stroke="#ef4444" stroke-width="4"/><text x="125" y="58" text-anchor="middle" font-family="Arial" font-size="42">♨</text><text x="125" y="105" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#7f1d1d">Нагрев</text><text x="125" y="138" text-anchor="middle" font-family="Arial" font-size="18" fill="#991b1b">Контроль времени</text><text x="125" y="160" text-anchor="middle" font-family="Arial" font-size="18" fill="#991b1b">и температуры внутри</text></g>
  <text x="70" y="380" font-family="Arial" font-size="19" fill="#475569">Сырые и готовые продукты разделяют; повторное загрязнение после тепловой обработки недопустимо.</text><text x="70" y="420" font-family="Arial" font-size="17" fill="#64748b">Точные режимы определяют по рецептуре, виду продукта и действующим санитарным требованиям.</text>
</svg>

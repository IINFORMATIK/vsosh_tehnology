<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Цветовой круг</title><desc id="desc">Основные, составные и дополнительные цвета с примерами гармоничных сочетаний.</desc>
  <rect width="900" height="560" rx="28" fill="#f8fafc"/><text x="42" y="52" font-family="Arial" font-size="27" font-weight="700" fill="#0f172a">Цветовой круг и гармонии</text>
  <g transform="translate(300 300)"><path d="M0 0 L0-180 A180 180 0 0 1 90-156Z" fill="#ef4444"/><path d="M0 0 L90-156 A180 180 0 0 1 156-90Z" fill="#f97316"/><path d="M0 0 L156-90 A180 180 0 0 1 180 0Z" fill="#facc15"/><path d="M0 0 L180 0 A180 180 0 0 1 156 90Z" fill="#84cc16"/><path d="M0 0 L156 90 A180 180 0 0 1 90 156Z" fill="#22c55e"/><path d="M0 0 L90 156 A180 180 0 0 1 0 180Z" fill="#14b8a6"/><path d="M0 0 L0 180 A180 180 0 0 1-90 156Z" fill="#06b6d4"/><path d="M0 0 L-90 156 A180 180 0 0 1-156 90Z" fill="#3b82f6"/><path d="M0 0 L-156 90 A180 180 0 0 1-180 0Z" fill="#4f46e5"/><path d="M0 0 L-180 0 A180 180 0 0 1-156-90Z" fill="#7c3aed"/><path d="M0 0 L-156-90 A180 180 0 0 1-90-156Z" fill="#c026d3"/><path d="M0 0 L-90-156 A180 180 0 0 1 0-180Z" fill="#ec4899"/><circle r="72" fill="#fff" stroke="#e2e8f0" stroke-width="5"/></g>
  <g font-family="Arial" fill="#0f172a"><text x="545" y="155" font-size="23" font-weight="700">Основные</text><circle cx="565" cy="190" r="14" fill="#ef4444"/><circle cx="610" cy="190" r="14" fill="#facc15"/><circle cx="655" cy="190" r="14" fill="#3b82f6"/><text x="545" y="250" font-size="23" font-weight="700">Родственные</text><text x="545" y="280" font-size="19">Соседние сектора круга</text><text x="545" y="340" font-size="23" font-weight="700">Дополнительные</text><text x="545" y="370" font-size="19">Противоположные цвета</text><text x="545" y="430" font-size="23" font-weight="700">Триада</text><text x="545" y="460" font-size="19">Три цвета через равные интервалы</text></g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t"><title id="t">Поля допуска и виды посадок</title><style>.h{font:700 29px Arial;fill:#17325c}.n{font:700 21px Arial;fill:#174ea6}.p{font:16px Arial;fill:#40536c}.hole{fill:#bde8ff;stroke:#2587c8;stroke-width:3}.shaft{fill:#ffd8a8;stroke:#e08a28;stroke-width:3}.z{stroke:#40536c;stroke-width:3;stroke-dasharray:8 6}</style><rect width="1200" height="560" fill="white"/><text x="600" y="48" text-anchor="middle" class="h">Посадки отверстия и вала</text><line x1="55" y1="285" x2="1145" y2="285" class="z"/><text x="60" y="275" class="p">нулевая линия</text><g transform="translate(85 90)"><text x="145" y="35" text-anchor="middle" class="n">С зазором</text><rect x="55" y="80" width="180" height="110" class="hole"/><rect x="75" y="220" width="140" height="70" class="shaft"/><text x="145" y="330" text-anchor="middle" class="p">поля не пересекаются</text><text x="145" y="360" text-anchor="middle" class="p">вал гарантированно меньше</text></g><g transform="translate(455 90)"><text x="145" y="35" text-anchor="middle" class="n">Переходная</text><rect x="55" y="110" width="180" height="110" class="hole"/><rect x="75" y="180" width="140" height="90" class="shaft"/><text x="145" y="330" text-anchor="middle" class="p">поля частично пересекаются</text><text x="145" y="360" text-anchor="middle" class="p">возможен зазор или натяг</text></g><g transform="translate(825 90)"><text x="145" y="35" text-anchor="middle" class="n">С натягом</text><rect x="55" y="220" width="180" height="80" class="hole"/><rect x="75" y="90" width="140" height="100" class="shaft"/><text x="145" y="330" text-anchor="middle" class="p">поля не пересекаются</text><text x="145" y="360" text-anchor="middle" class="p">вал гарантированно больше</text></g><rect x="375" y="500" width="26" height="16" class="hole"/><text x="410" y="514" class="p">отверстие</text><rect x="620" y="500" width="26" height="16" class="shaft"/><text x="655" y="514" class="p">вал</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
  <title id="title">Этапы дизайн-проекта</title><desc id="desc">Последовательность от исследования потребностей до проверки готового решения.</desc>
  <rect width="1100" height="500" rx="28" fill="#f8fafc"/><text x="42" y="55" font-family="Arial" font-size="28" font-weight="700" fill="#0f172a">Последовательность дизайн-проекта</text>
  <g transform="translate(35 135)" font-family="Arial" text-anchor="middle"><g fill="#fff" stroke="#cbd5e1" stroke-width="3"><rect width="175" height="190" rx="18"/><rect x="205" width="175" height="190" rx="18"/><rect x="410" width="175" height="190" rx="18"/><rect x="615" width="175" height="190" rx="18"/><rect x="820" width="175" height="190" rx="18"/></g><g font-size="38"><text x="88" y="67">?</text><text x="293" y="67">⌂</text><text x="498" y="67">✎</text><text x="703" y="67">▦</text><text x="908" y="67">✓</text></g><g font-size="19" font-weight="700" fill="#334155"><text x="88" y="112">Исследование</text><text x="293" y="112">Обмеры</text><text x="498" y="112">Концепция</text><text x="703" y="112">Проектирование</text><text x="908" y="112">Проверка</text></g><g font-size="15" fill="#64748b"><text x="88" y="142">Пользователь</text><text x="88" y="164">и задача</text><text x="293" y="142">Среда и</text><text x="293" y="164">ограничения</text><text x="498" y="142">Образ, стиль</text><text x="498" y="164">и варианты</text><text x="703" y="142">План, размеры</text><text x="703" y="164">и материалы</text><text x="908" y="142">Макет, сценарий</text><text x="908" y="164">и оценка</text></g></g>
  <g stroke="#2563eb" stroke-width="5" fill="#2563eb"><path d="M215 230h18M420 230h18M625 230h18M830 230h18"/><path d="m233 230-12-8v16zm205 0-12-8v16zm205 0-12-8v16zm205 0-12-8v16z"/></g>
  <text x="42" y="405" font-family="Arial" font-size="18" fill="#475569">Процесс итерационный: результаты проверки могут вернуть проект к планировке, концепции или исходному исследованию.</text>
</svg>

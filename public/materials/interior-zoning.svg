<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" role="img" aria-labelledby="title desc">
  <title id="title">Функциональное зонирование помещения</title><desc id="desc">Условный план комнаты с зонами отдыха, работы, хранения и движения.</desc>
  <rect width="980" height="600" rx="28" fill="#f8fafc"/><text x="42" y="55" font-family="Arial" font-size="28" font-weight="700" fill="#0f172a">Функциональное зонирование помещения</text>
  <g transform="translate(55 100)"><rect width="560" height="430" fill="#fff" stroke="#334155" stroke-width="8"/><path d="M560 335 H515 A45 45 0 0 0 560 380" fill="none" stroke="#334155" stroke-width="5"/><rect x="25" y="25" width="290" height="210" rx="18" fill="#dbeafe"/><rect x="335" y="25" width="200" height="210" rx="18" fill="#dcfce7"/><rect x="25" y="255" width="180" height="145" rx="18" fill="#fef3c7"/><path d="M225 255 H535 V400 H225Z" fill="#f3e8ff"/><g font-family="Arial" font-size="20" text-anchor="middle" fill="#0f172a"><text x="170" y="125" font-weight="700">Отдых</text><text x="435" y="125" font-weight="700">Работа</text><text x="115" y="330" font-weight="700">Хранение</text><text x="380" y="330" font-weight="700">Свободная зона</text><text x="380" y="357" fill="#64748b">и пути движения</text></g><g stroke="#2563eb" stroke-width="4" fill="none" stroke-dasharray="9 7"><path d="M548 357 C450 357 430 275 330 275 C250 275 250 215 250 190"/></g></g>
  <g transform="translate(670 140)" font-family="Arial"><text font-size="22" font-weight="700" fill="#0f172a">Проверка планировки</text><g font-size="18" fill="#475569"><text y="48">• функции не конфликтуют;</text><text y="84">• проходы свободны;</text><text y="120">• есть естественный свет;</text><text y="156">• хранение доступно;</text><text y="192">• мебель соответствует масштабу;</text><text y="228">• предусмотрена безопасность.</text></g></g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t"><title id="t">Конечный автомат мобильного робота</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#246bd3"/></marker></defs><style>.h{font:700 29px Arial;fill:#17325c}.n{font:700 21px Arial;fill:#174ea6}.p{font:16px Arial;fill:#40536c}.b{fill:#f8fbff;stroke:#8db3ed;stroke-width:3}.a{fill:none;stroke:#246bd3;stroke-width:5;marker-end:url(#a)}</style><rect width="1200" height="560" fill="white"/><text x="600" y="48" text-anchor="middle" class="h">Пример конечного автомата робота</text><g transform="translate(80 205)"><rect width="210" height="120" rx="60" class="b"/><text x="105" y="50" text-anchor="middle" class="n">Ожидание</text><text x="105" y="82" text-anchor="middle" class="p">двигатели выключены</text></g><g transform="translate(495 80)"><rect width="210" height="120" rx="60" class="b"/><text x="105" y="50" text-anchor="middle" class="n">Движение</text><text x="105" y="82" text-anchor="middle" class="p">ехать вперёд</text></g><g transform="translate(910 205)"><rect width="210" height="120" rx="60" class="b"/><text x="105" y="50" text-anchor="middle" class="n">Препятствие</text><text x="105" y="82" text-anchor="middle" class="p">остановиться</text></g><g transform="translate(495 390)"><rect width="210" height="120" rx="60" class="b"/><text x="105" y="50" text-anchor="middle" class="n">Объезд</text><text x="105" y="82" text-anchor="middle" class="p">поворот и контроль</text></g><path d="M290 230Q390 120 490 135" class="a"/><text x="385" y="135" text-anchor="middle" class="p">команда «Старт»</text><path d="M705 135Q820 125 910 220" class="a"/><text x="820" y="130" text-anchor="middle" class="p">расстояние мало</text><path d="M1015 330Q910 445 710 450" class="a"/><text x="875" y="430" text-anchor="middle" class="p">выбрать направление</text><path d="M495 450Q300 455 190 33
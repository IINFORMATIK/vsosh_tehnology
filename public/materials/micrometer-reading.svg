<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t"><title id="t">Устройство микрометра и чтение шкалы</title><style>.h{font:700 29px Arial;fill:#17325c}.n{font:700 20px Arial;fill:#174ea6}.p{font:16px Arial;fill:#40536c}.s{fill:none;stroke:#29486e;stroke-width:6}.b{fill:#f7faff;stroke:#8db3ed;stroke-width:3}</style><rect width="1200" height="560" fill="white"/><text x="600" y="48" text-anchor="middle" class="h">Гладкий микрометр 0–25 мм</text><path d="M170 150C60 150 60 410 170 410h290V350H190c-35 0-35-140 0-140h270v-60z" class="s"/><rect x="450" y="245" width="95" height="70" class="b"/><rect x="545" y="225" width="280" height="110" rx="10" class="b"/><rect x="825" y="205" width="180" height="150" rx="16" class="b"/><rect x="1005" y="235" width="100" height="90" rx="12" class="b"/><path d="M450 280H190M545 280H1105" class="s"/><text x="115" y="455" class="n">Скоба</text><text x="405" y="350" class="n">Пятка</text><text x="575" y="370" class="n">Стебель</text><text x="850" y="390" class="n">Барабан</text><text x="1015" y="355" class="n">Трещотка</text><g transform="translate(315 455)"><text x="0" y="0" class="p">Показание = шкала стебля + шкала барабана</text><text x="430" y="0" class="n">например: 7,5 + 0,28 = 7,78 мм</text></g><g stroke="#29486e" stroke-width="2"><path d="M590 245v45m35-25v25m35-45v45m35-25v25m35-45v45m35-25v25"/><path d="M855 220v50m30-35v35m30-35v35m30-35v35m30-35v35"/></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Основные системы беспочвенного выращивания</title>
  <desc id="desc">Сравнение NFT, капельной гидропоники и аэропоники</desc>
  <defs><style>.t{font:700 30px Arial;fill:#17325c}.h{font:700 24px Arial;fill:#174ea6}.p{font:18px Arial;fill:#30445f}.box{fill:#f7faff;stroke:#9bbcf2;stroke-width:3}.water{fill:#bde8ff;stroke:#2587c8;stroke-width:3}.plant{fill:#44a46c;stroke:#24724a;stroke-width:3}.root{fill:none;stroke:#b47b35;stroke-width:5}.flow{fill:none;stroke:#1677c8;stroke-width:5;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#1677c8"/></marker></defs>
  <rect width="1200" height="620" fill="#fff"/><text x="600" y="48" text-anchor="middle" class="t">Системы беспочвенного выращивания</text>
  <g transform="translate(35 85)"><rect class="box" width="350" height="485" rx="22"/><text x="175" y="43" text-anchor="middle" class="h">NFT</text><text x="175" y="73" text-anchor="middle" class="p">тонкий проточный слой раствора</text><rect x="45" y="225" width="260" height="72" rx="12" class="water"/><path d="M75 258H270" class="flow"/><path d="M110 195v70m0-70c-32-18-38-45-6-48m6 48c32-18 38-45 6-48" class="plant" fill="none"/><path d="M110 263q-18 55 4 92m0-92q20 55-3 92" class="root"/><text x="175" y="405" text-anchor="middle" class="p">Контроль: непрерывность потока</text><text x="175" y="435" text-anchor="middle" class="p">и резерв при остановке насоса</text></g>
  <g transform="translate(425 85)"><rect class="box" width="350" height="485" rx="22"/><text x="175" y="43" text-anchor="middle" class="h">Капельная система</text><text x="175" y="73" text-anchor="middle" class="p">раствор подаётся к субстрату</text><rect x="85" y="235" width="180" height="115" rx="12" fill="#d9b98c" stroke="#9b6c31" stroke-width="3"/><path d="M175 125v80" class="flow"/><circle cx="175" cy="220" r="8" fill="#1677c8"/><path d="M175 200v70m0-70c-35-18-42-48-8-52m8 52c35-18 42-48 8-52" class="plant" fill="none"/><path d="M175 267q-35 45-15 80m15-80q35 45 15 80" class="root"/><text x="175" y="405" text-anchor="middle" class="p">Контроль: равномерность капельниц,</text><text x="175" y="435" text-anchor="middle" class="p">дренаж и влажность субстрата</text></g>
  <g transform="translate(815 85)"><rect class="box" width="350" height="485" rx="22"/><text x="175" y="43" text-anchor="middle" class="h">Аэропоника</text><text x="175" y="73" text-anchor="middle" class="p">корни орошаются аэрозолем</text><rect x="70" y="215" width="210" height="165" rx="18" fill="#eef8ff" stroke="#79add4" stroke-width="3"/><path d="M175 125v125m0-50c-35-18-42-48-8-52m8 52c35-18 42-48 8-52" class="plant" fill="none"/><path d="M175 247q-38 48-18 105m18-105q38 48 18 105" class="root"/><g fill="#48a9e6"><circle cx="105" cy="310" r="7"/><circle cx="128" cy="285" r="6"/><circle cx="245" cy="310" r="7"/><circle cx="222" cy="285" r="6"/></g><text x="175" y="405" text-anchor="middle" class="p">Контроль: форсунки, интервалы</text><text x="175" y="435" text-anchor="middle" class="p">орошения и аварийный режим</text></g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Жизненный цикл изделия</title><desc id="desc">Этапы от сырья до повторного использования и переработки</desc>
  <defs><style>.t{font:700 30px Arial;fill:#17325c}.h{font:700 20px Arial;fill:#174ea6}.p{font:17px Arial;fill:#30445f}.b{fill:#f7faff;stroke:#79a7ef;stroke-width:3}.a{fill:none;stroke:#246bd3;stroke-width:5;marker-end:url(#m)}.c{fill:none;stroke:#42a166;stroke-width:6;stroke-dasharray:12 8;marker-end:url(#g)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#246bd3"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#42a166"/></marker></defs>
  <rect width="1200" height="620" fill="#fff"/><text x="600" y="48" text-anchor="middle" class="t">Жизненный цикл изделия</text>
  <g transform="translate(35 180)"><rect width="180" height="150" rx="22" class="b"/><text x="90" y="55" text-anchor="middle" class="h">Сырьё</text><text x="90" y="90" text-anchor="middle" class="p">материалы</text><text x="90" y="118" text-anchor="middle" class="p">и энергия</text></g><path d="M220 255H280" class="a"/>
  <g transform="translate(285 180)"><rect width="180" height="150" rx="22" class="b"/><text x="90" y="55" text-anchor="middle" class="h">Изготовление</text><text x="90" y="90" text-anchor="middle" class="p">технология</text><text x="90" y="118" text-anchor="middle" class="p">и отходы</text></g><path d="M470 255H530" class="a"/>
  <g transform="translate(535 180)"><rect width="180" height="150" rx="22" class="b"/><text x="90" y="55" text-anchor="middle" class="h">Транспорт</text><text x="90" y="90" text-anchor="middle" class="p">упаковка</text><text x="90" y="118" text-anchor="middle" class="p">и логистика</text></g><path d="M720 255H780" class="a"/>
  <g transform="translate(785 180)"><rect width="180" height="150" rx="22" class="b"/><text x="90" y="55" text-anchor="middle" class="h">Использование</text><text x="90" y="90" text-anchor="middle" class="p">уход</text><text x="90" y="118" text-anchor="middle" class="p">и ремонт</text></g><path d="M970 255H1030" class="a"/>
  <g transform="translate(1035 180)"><rect width="130" height="150" rx="22" fill="#f2fbf5" stroke="#56a875" stroke-width="3"/><text x="65" y="45" text-anchor="middle" class="h">Конец</text><text x="65" y="73" text-anchor="middle" class="h">службы</text><text x="65" y="108" text-anchor="middle" class="p">разборка</text><text x="65" y="133" text-anchor="middle" class="p">и сортировка</text></g>
  <path d="M1100 338V475H125V338" class="c"/><text x="610" y="455" text-anchor="middle" class="h" fill="#287b4a">Повторное использование • восстановление • переработка</text><text x="600" y="540" text-anchor="middle" class="p">Оценивают расход ресурсов, долговечность, ремонтопригодность и возможность разборки на каждом этапе</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t"><title id="t">Параметры режима резания при точении</title><defs><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#246bd3"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#e08a28"/></marker></defs><style>.h{font:700 29px Arial;fill:#17325c}.n{font:700 20px Arial;fill:#174ea6}.p{font:16px Arial;fill:#40536c}.part{fill:#dce8f8;stroke:#315a8c;stroke-width:4}.tool{fill:#ffd8a8;stroke:#c57217;stroke-width:4}.a{fill:none;stroke:#246bd3;stroke-width:6;marker-end:url(#b)}.o{fill:none;stroke:#e08a28;stroke-width:6;marker-end:url(#o)}</style><rect width="1200" height="560" fill="white"/><text x="600" y="48" text-anchor="middle" class="h">Параметры режима резания</text><rect x="150" y="210" width="700" height="170" rx="85" class="part"/><ellipse cx="150" cy="295" rx="55" ry="85" fill="#eef5fd" stroke="#315a8c" stroke-width="4"/><path d="M850 260l210 35-210 35z" class="tool"/><path d="M260 180c-100-100-225-10-170 90" class="a"/><text x="90" y="145" class="n">V — скорость резания</text><path d="M895 425H650" class="a"/><text x="700" y="465" class="n">S — подача</text><path d="M840 245v100" class="o"/><text x="865" y="205" class="n">t — глубина</text><line x1="850" y1="295" x2="955" y2="295" stroke="#c57217" stroke-width="3" stroke-dasharray="8 6"/><g transform="translate(140 490)"><text class="p">n = 1000 · V / (π · D)</text><text x="420" class="p">Tм = L / (n · S)</text><text x="780" class="p">Выбор режима зависит от материала и инструмента</text></g></svg>

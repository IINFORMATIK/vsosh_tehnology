<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t"><title id="t">Раскладка лекал на ткани</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#246bd3"/></marker></defs><style>.h{font:700 29px Arial;fill:#17325c}.n{font:700 18px Arial;fill:#174ea6}.p{font:15px Arial;fill:#40536c}.cloth{fill:#f8f3e9;stroke:#b69464;stroke-width:4}.piece{fill:#dce8f8;stroke:#315a8c;stroke-width:3}.grain{stroke:#246bd3;stroke-width:4;marker-end:url(#a)}</style><rect width="1200" height="600" fill="white"/><text x="600" y="48" text-anchor="middle" class="h">Пример раскладки лекал</text><rect x="65" y="105" width="1070" height="390" rx="10" class="cloth"/><line x1="65" y1="300" x2="1135" y2="300" stroke="#b69464" stroke-width="3" stroke-dasharray="10 8"/><text x="80" y="290" class="n">сгиб ткани</text><path d="M130 145q100-35 190 15l40 240q-110 30-220 0z" class="piece"/><path d="M400 145q85-30 165 15l25 230q-90 25-180 0z" class="piece"/><path d="M650 150q80 15 115 95l-65 165q-65-10-100-55z" class="piece"/><path d="M800 165q80-15 150 40l-20 180q-75 20-140-20z" class="piece"/><path d="M980 145q60 20 90 75l-40 130q-55 0-85-40z" class="piece"/><path d="M200 345v-130M480 350v-135M680 345v-120M860 350v-120M1010 310v-100" class="grain"/><text x="175" y="205" class="p">долевая</text><text x="80" y="535" class="p">Кромка</text><line x1="65" y1="510" x2="1135" y2="510" stroke="#40536c" stroke-width="2"/><text x="490" y="555" class="n">Все стрелки долевой нити параллельны кромке; учитываются парность, рисунок и ворс</text></svg>
